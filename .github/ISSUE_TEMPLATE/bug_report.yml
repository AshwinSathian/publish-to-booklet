name: Bug report
description: The action isn't behaving the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow step
      description: The `uses: AshwinSathian/publish-to-booklet@...` step from your workflow YAML (redact the API key).
      render: yaml
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Action run log
      description: The relevant Action run output, or a link to it if the repo is public.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / ref used
      description: e.g. "@v1", "@v1.0.1", or a commit SHA
    validations:
      required: true
